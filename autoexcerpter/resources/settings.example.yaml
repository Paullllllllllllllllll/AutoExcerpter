# AutoExcerpter settings: machine values and optional run defaults.
#
# Copy this file to config/settings.yaml in the repository (gitignored) and
# edit the copy, or pass another file with --settings FILE. Every key is
# optional; a missing key keeps the value shown here. Unknown keys are errors.
# Relative paths resolve against the current directory.

# Environment-variable NAMES that hold each provider's API key (never the key).
api_keys:
  openai: OPENAI_API_KEY
  anthropic: ANTHROPIC_API_KEY
  google: GOOGLE_API_KEY
  openrouter: OPENROUTER_API_KEY

# Named OpenAI-compatible endpoints, selected with --endpoint NAME.
endpoints: {}
#  example:
#    base_url: https://your-endpoint.example.com/v1/
#    api_key_env: YOUR_ENDPOINT_API_KEY
#    supports_vision: true   # the model accepts images
#    supports_schema: false  # the API enforces JSON schemas

# HTTP timeouts in seconds. request is the read timeout; 900 s suits the
# OpenAI flex tier, which may queue requests.
timeouts:
  request: 900
  connect: 10
  write: 30
  pool: 30

# Rate limits per provider as [max_requests, window_seconds].
rate_limits:
  - [10, 1]
  - [600, 60]
  - [600, 3600]

# Retries of failed API calls: wait = backoff_base * multiplier^n + jitter,
# capped at backoff_cap seconds (a server's Retry-After included).
retry:
  max_attempts: 8  # every call, the first included
  backoff_base: 0.5
  backoff_cap: 120
  backoff_multipliers:
    rate_limit: 2.0
    timeout: 1.5
    connection: 1.5
    server_error: 2.0
    other: 2.0
    validation: 1.5
  jitter:
    min: 0.5
    max: 1.0
  # Retries driven by the model output: invalid JSON (validation_failure) or
  # a flag the model sets.
  schema_retries:
    transcription:
      validation_failure:
        enabled: true
        max_attempts: 3
        backoff_base: 0.5
        backoff_multiplier: 1.5
      no_transcribable_text:
        enabled: false
        max_attempts: 0
        backoff_base: 0.1
        backoff_multiplier: 1.5
      transcription_not_possible:
        enabled: true
        max_attempts: 3
        backoff_base: 0.1
        backoff_multiplier: 1.5
    summary:
      validation_failure:
        enabled: true
        max_attempts: 3
        backoff_base: 0.5
        backoff_multiplier: 1.5

# Pause in seconds between starting two page requests (--concurrency bounds
# the requests in flight).
concurrency:
  delay_between_tasks: 0

# Folder of the OpenAlex cache; '' means .autoexcerpter in the home folder.
state_dir: ''

# Log folder, or a file ending in .log; '' writes no log file (warnings and
# errors go to the console).
logs_dir: ''

# OpenAlex citation lookups.
openalex:
  email: ''  # contact address for the polite pool; '' sends none
  api_key_env: OPENALEX_API_KEY  # variable holding the key; unset sends none
  max_requests: 300  # citations looked up per document

# Long-side limit in pixels of OpenAI pages sent at original detail; null
# keeps the model's default (3000 for gpt-6-luna, none for other models).
images:
  original_max_side_px: null

# Provider prompt caching of the system prompt (instructions and schema).
prompt_caching:
  enabled: true
  anthropic:
    ttl: 5m  # 5m or 1h
  openai:
    prompt_cache_retention: null  # or 24h: documented models; GPT-5.6+ get ttl 30m
  openrouter:
    anthropic_cache_control: true

# Run defaults keyed by option name (flags override them), for example:
# defaults:
#   model: gpt-6-luna
#   reasoning_effort: high
#   transcription_verbosity: high
#   summary_verbosity: low
#   service_tier: flex
#   # One transcription format (transcription-md or transcription-txt) and the
#   # summary formats; the database is always written.
#   formats: [transcription-md, summary-md, summary-docx]
#   concurrency: 16
#   batch: false  # true submits to the batch APIs; collect with batch check
#   # Summary context for items without a sidecar: topics or a text file.
#   # A context default would override the sidecars, like --context.
#   fallback_context: path/to/summary_topics.txt

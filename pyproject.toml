[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoexcerpter"
version = "1.0.0"
description = "Document processing pipeline that transcribes and summarizes PDFs and image collections using vision-enabled LLMs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "PyMuPDF>=1.28",
    "Pillow>=12.3",
    "PyYAML>=6.0",
    "langchain-core>=1.4",
    "langchain-openai>=1.3",
    "langchain-anthropic>=1.4",
    "langchain-google-genai>=4.2",
    "httpx>=0.28.1",
    "requests>=2.34",
    "python-docx>=1.2",
    "mathml2omml>=0.0.2",
    "latex2mathml>=3.80",
    "questionary>=2.1",
    "rich>=15.0",
]

[project.scripts]
autoexcerpter = "autoexcerpter.__main__:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.3",
    "ruff>=0.15",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
    "pytest>=9.1",
    "pytest-mock>=3.15",
    "pytest-cov>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["autoexcerpter"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-include = ["*.ipynb"]
extend-exclude = ["scratch", ".claude", "backup"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM",
    "C901", "PLR0912", "PLR0913", "PLR0915", "BLE001", "T201", "ERA001",
]
ignore = ["UP047"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]
"autoexcerpter/cli/**" = ["T201"]
"autoexcerpter/ui/**" = ["T201"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = false

[tool.deptry]
# Treat the dev extra as development dependencies (pytest, mypy, ruff, and the
# type stubs are not imported in the shipped source tree).
pep621_dev_dependency_groups = ["dev"]
# tests/ carries analysis-only imports that are intentionally undeclared.
extend_exclude = ["tests"]

[tool.deptry.package_module_name_map]
# Distributions whose import name differs from the package name; declaring these
# keeps scans accurate even when deptry runs outside the project venv.
PyYAML = ["yaml"]
PyMuPDF = ["fitz"]
Pillow = ["PIL"]
python-docx = ["docx"]

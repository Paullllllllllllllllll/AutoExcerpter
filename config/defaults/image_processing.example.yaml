# Image processing defaults. Copy this example to customize a local config.
# Numeric runs: direct renders to the profile; supersample resizes afterward.
# Native runs always render directly to the resolved model cap or profile.
# May be overridden with render_strategy inside a provider section.
render_strategy: direct
# Numeric rendering only; 0 disables the memory guard.
max_pixels_per_page: 24000000
# Downscaling filter: bilinear (fast) or lanczos (quality).
resampling_algorithm: bilinear

# Registry caps apply in numeric and native modes. Optional original_max_side_px,
# original_max_pixels (OpenAI), and high_max_side_px (Anthropic) only tighten caps.
# OpenAI original: 30,000 patches of 32 px for GPT-5.6/GPT-6, otherwise
# 10,000 patches and a 6,000 px edge. Anthropic: 2,576 px / 4,784 patches
# of 28 px for high-resolution models; 1,568 px / 1,568 patches otherwise.

api_image_processing:
  # Positive render DPI or native (density of the largest page-spanning scan).
  target_dpi: native
  # Used by native mode for pages without a usable scan image.
  native_fallback_dpi: 300
  # jpeg or lossless png; oversized PNG falls back to JPEG with a warning.
  payload_format: jpeg
  # Base64 bytes per image; 0 disables the guard. Oversized JPEG is a page error.
  max_image_bytes: 50000000
  grayscale_conversion: true
  handle_transparency: true
  jpeg_quality: 95
  llm_detail: original
  # auto selects the detail profile; none disables only optional profile sizing.
  resize_profile: high
  low_max_side_px: 512
  high_target_box: [768, 1536]

anthropic_image_processing:
  # Positive render DPI or native (density of the largest page-spanning scan).
  target_dpi: native
  # Used by native mode for pages without a usable scan image.
  native_fallback_dpi: 300
  # jpeg or lossless png; oversized PNG falls back to JPEG with a warning.
  payload_format: jpeg
  # Base64 bytes per image; 0 disables the guard. Oversized JPEG is a page error.
  max_image_bytes: 10000000
  grayscale_conversion: true
  handle_transparency: true
  jpeg_quality: 95
  # auto selects the detail profile; none disables only optional profile sizing.
  resize_profile: auto
  low_max_side_px: 512
  high_target_box: [768, 1536]

google_image_processing:
  # Positive render DPI or native (density of the largest page-spanning scan).
  target_dpi: 300
  # Used by native mode for pages without a usable scan image.
  native_fallback_dpi: 300
  # jpeg or lossless png; oversized PNG falls back to JPEG with a warning.
  payload_format: jpeg
  # Base64 bytes per image; 0 disables the guard. Oversized JPEG is a page error.
  max_image_bytes: 20000000
  grayscale_conversion: true
  handle_transparency: true
  jpeg_quality: 95
  # Server-side image resolution budget; no documented pixel maximum.
  media_resolution: high
  # auto selects the detail profile; none disables only optional profile sizing.
  resize_profile: high
  low_max_side_px: 512
  high_target_box: [768, 1536]

custom_image_processing:
  # Positive render DPI or native (density of the largest page-spanning scan).
  target_dpi: 150
  # Used by native mode for pages without a usable scan image.
  native_fallback_dpi: 300
  # jpeg or lossless png; oversized PNG falls back to JPEG with a warning.
  payload_format: jpeg
  # Base64 bytes per image; 0 disables the guard. Oversized JPEG is a page error.
  max_image_bytes: 0
  grayscale_conversion: true
  handle_transparency: true
  jpeg_quality: 85
  llm_detail: high
  # auto selects the detail profile; none disables only optional profile sizing.
  resize_profile: low
  low_max_side_px: 768
  high_target_box: [512, 1024]

# =============================================================================
# Text Cleaning Configuration
# =============================================================================
# Post-processing for transcription text before summarization and output.
# Fixes common OCR artifacts while preserving semantic content.

text_cleaning:
  enabled: true  # Master switch for all text cleaning

  # ---------------------------------------------------------------------------
  # Unicode Normalization
  # ---------------------------------------------------------------------------
  # NFC normalization, removes control chars, soft hyphens, zero-width spaces
  unicode_normalization: true

  # ---------------------------------------------------------------------------
  # LaTeX Formula Fixing
  # ---------------------------------------------------------------------------
  # Repairs common OCR errors in mathematical notation
  latex_fixing:
    enabled: true
    balance_dollar_signs: true       # Fix unbalanced $ and $$ delimiters
    close_unclosed_braces: true      # Close orphan { in LaTeX commands
    fix_common_commands: true        # Fix typos like "\frac {" -> "\frac{"
    normalize_math_delimiters: true  # \(..\) -> $..$ and \[..\] -> $$..$$
    balance_left_right: true         # Add \left./\right. for unmatched \left/\right (per $$ block)
    convert_html_subsup: true        # X<sub>y</sub> -> $X_y$ / X<sup>y</sup> -> $X^y$ (outside math)

  # ---------------------------------------------------------------------------
  # Hyphenation Merging
  # ---------------------------------------------------------------------------
  # Rejoins words split at line breaks: "politi-\nche" -> "politiche"
  # A conservative guard keeps genuine compounds (e.g. "Jean-Baptiste",
  # "co-ordinating") via should_keep_hyphen(); see HYPHEN_KEEP_PREFIXES.
  merge_hyphenation: true  # Enabled: merges OCR line-break hyphenation

  # ---------------------------------------------------------------------------
  # Whitespace Normalization
  # ---------------------------------------------------------------------------
  whitespace_normalization:
    enabled: true
    collapse_internal_spaces: true  # 3+ spaces -> 2 spaces
    max_blank_lines: 2              # Remove excess blank lines
    tab_size: 4                     # Spaces per tab when expanding

  # ---------------------------------------------------------------------------
  # Line Wrapping
  # ---------------------------------------------------------------------------
  # WARNING: Keep this disabled. The transcription prompt already preserves the
  # source's printed line breaks, so wrapping re-breaks already laid-out text
  # and produces spurious short "orphan" lines mid-paragraph. It is not needed
  # for LLM output. Only enable for raw OCR with pathologically long lines.
  line_wrapping:
    enabled: false
    auto_width: true   # Compute width from text statistics
    fixed_width: 80    # Used if auto_width is false

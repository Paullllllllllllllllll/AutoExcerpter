# =============================================================================
# Concurrency and Retry Configuration -- EXAMPLE / BUNDLED DEFAULTS
# =============================================================================
# This file ships with the repository as a scrubbed template.
# On a fresh clone it is loaded automatically when concurrency.yaml is absent.
#
# To customize: copy this file to concurrency.yaml (same directory) and edit it.
#   cp config/defaults/concurrency.example.yaml config/defaults/concurrency.yaml
#
# Controls parallel processing, rate limiting, and retry behavior.
#
# Related config files:
#   - app.yaml: Application settings and feature toggles
#   - model.yaml: LLM provider and model settings
#   - image_processing.yaml: Image preprocessing settings

# =============================================================================
# API CONCURRENCY SETTINGS
# =============================================================================
# Controls LLM API requests for transcription and summarization
# Applies to all providers: OpenAI, Anthropic, Google, OpenRouter
api_requests:
  # ---------------------------------------------------------------------------
  # Global Settings (apply to all API calls)
  # ---------------------------------------------------------------------------
  api_timeout: 900  # Request timeout (seconds). 900s for flex tier queuing

  # Per-phase HTTP timeouts (OpenAI-family clients only: openai, openrouter,
  # custom). api_timeout above is the READ phase; a scalar float would replace
  # all four phases and make `connect` 900s too. Anthropic and Google keep a
  # plain float -- their LangChain wrappers require it.
  #
  # Windows note: langchain-openai already applies a default SO_KEEPALIVE +
  # TCP_USER_TIMEOUT socket profile (~90-120s dead-peer bound, tunable via
  # LANGCHAIN_OPENAI_TCP_* env vars), but TCP_USER_TIMEOUT is unavailable on
  # win32 (keepalive only), so on Windows the read timeout and the call
  # watchdog (retry.call_timeout) are the primary stall detectors -- keep
  # api_timeout tight (120-300s) outside the `flex` service tier.
  connect_timeout: 10
  write_timeout: 30
  pool_timeout: 30

  # Rate limiting: [max_requests, window_seconds]
  # Conservative defaults for new/free-tier accounts; raise after verifying
  # your provider tier allows higher throughput.
  rate_limits:
    - [10, 1]       # Per-second burst limit
    - [600, 60]     # Per-minute sustained limit
    - [600, 3600]   # Per-hour aggregate limit

  # ---------------------------------------------------------------------------
  # Transcription Phase
  # ---------------------------------------------------------------------------
  transcription:
    concurrency_limit: 80  # Parallel API requests (recommended for OpenAI tier 3)

    # OpenAI service tier: 'default' | 'flex' | 'priority'
    # flex = cheaper but may queue; priority = fastest but expensive
    # Recommended: flex (pair with api_timeout 900 above).
    service_tier: flex

  # NOTE: Summaries run inline within the transcription workers and share the
  # transcription phase's concurrency and one rate limiter per provider, so a
  # separate `summary:` concurrency block is intentionally not used.
  # Summary-phase OpenAI service tier falls back to the transcription tier.

# =============================================================================
# RETRY & BACKOFF CONFIGURATION
# =============================================================================
# Exponential backoff with jitter for API errors (OpenAI Cookbook best practices)
# Formula: wait_time = backoff_base * (multiplier ^ attempt) + random(jitter)
retry:
  # ---------------------------------------------------------------------------
  # API Error Retries
  # ---------------------------------------------------------------------------
  # Handles rate limits (429), timeouts, and server errors (5xx)
  max_attempts: 8  # Total attempts before giving up (OpenAI recommends 5-6)

  # Retry budget for TIMEOUT failures specifically (capped at max_attempts).
  # A timed-out request is billed server-side but returns no usage payload, so
  # every timeout retry is untracked overshoot. Cheap connection failures
  # (ConnectError, DNS) keep the full max_attempts budget; connect timeouts
  # fall under this budget instead.
  timeout_attempts: 3

  # Wall-clock ceiling (seconds) for ONE API call across ALL retry attempts.
  # api_timeout bounds a single attempt only, so without this the worst case
  # per call is max_attempts x api_timeout (8 x 900 s = 2 hours), and a page
  # whose inline summary also stalls doubles that. It bounds the RETRY LADDER,
  # not a hung in-flight attempt.
  # Values:
  #   auto  -- api_timeout x timeout_attempts + 300 s of backoff headroom
  #            (3000 s at these defaults; a bare `on` is YAML boolean true
  #            and also means auto)
  #   "off" -- disabled (quote it; a bare `off` is YAML boolean false, which
  #            is also accepted), or 0
  #   <n>   -- an explicit number of seconds
  # Trade-off: 3000 s can abort a slow-but-progressing flex/rate-limit ladder;
  # such pages degrade to error entries and are re-run by resume at full cost.
  # Set "off" to restore the old unbounded ladder.
  call_timeout: auto

  # Time-based retry horizon (s): bounds the TOTAL time spent retrying ONE
  # request from its first attempt. Recommended for OpenAI flex tier, which may
  # queue for up to ~15 min. Precedence: a transient error is retried while
  # EITHER attempts remain (max_attempts) OR this window is still open; it stops
  # only once BOTH are exhausted (so max_attempts becomes a floor, not a
  # ceiling). Set 0 to disable the window and use attempts-only (legacy) behavior.
  max_elapsed: 900
  backoff_base: 0.5  # Initial wait time in seconds
  backoff_cap: 120  # Hard ceiling (s) on any single wait, incl. server Retry-After

  # Error-specific multipliers (higher = longer waits)
  backoff_multipliers:
    rate_limit: 2.0   # 429 Too Many Requests
    timeout: 1.5      # Read/connect timeouts
    connection: 1.5   # Connection errors (DNS, refused, reset); behavior-
                      # preserving -- these rode the timeout multiplier before
                      # the two error classes were split
    server_error: 2.0 # 500-series errors
    other: 2.0        # Other retryable errors

  # Jitter prevents thundering herd (random delay added to backoff)
  jitter:
    min: 0.5
    max: 1.0

  # ---------------------------------------------------------------------------
  # Schema-Specific Retries
  # ---------------------------------------------------------------------------
  # Retry based on model output flags (not API errors)
  # Useful when model reports content issues that may resolve on retry
  schema_retries:
    # Transcription phase flags
    transcription:
      validation_failure:  # Invalid JSON or missing required schema keys
        enabled: true      # Fires BEFORE flag-specific retries
        max_attempts: 3    # Retry up to 3 times for malformed responses
        backoff_base: 0.5
        backoff_multiplier: 1.5

      no_transcribable_text:  # Image contains no text
        enabled: false
        max_attempts: 0  # 0 = disabled (usually correct, no point retrying)
        backoff_base: 0.1
        backoff_multiplier: 1.5

      transcription_not_possible:  # Illegible/corrupted image
        enabled: true
        max_attempts: 3  # Retry may help with transient model issues or refusal
        backoff_base: 0.1
        backoff_multiplier: 1.5

    # Summary phase flags (aligned with summary_schema.json v2.1.0)
    # The schema now uses structured page_information instead of boolean flags:
    #   - page_number_type: "roman" | "arabic" | "none"
    #   - page_types: array of ["content", "blank", "table_of_contents", ...]
    #   - bullet_points: null for non-content pages
    summary:
      validation_failure:  # Invalid JSON or missing required schema keys
        enabled: true      # Fires BEFORE flag-specific retries
        max_attempts: 3
        backoff_base: 0.5
        backoff_multiplier: 1.5
